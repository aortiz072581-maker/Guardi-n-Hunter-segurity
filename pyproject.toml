
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E","F","B","I","S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = "legacy"

[tool.pytest.ini_options]
norecursedirs = ["legacy", ".git", "__pycache__", ".guardian", "guardian-db", "guardian-db-v2"]
testpaths = ["guardian_hunter/tests"]

[tool.mutmut]
paths_to_mutate = ["guardian_hunter/core"]
